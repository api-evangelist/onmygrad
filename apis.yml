aid: onmygrad
name: OnMyGrad
description: >-
  OnMyGrad is a Hong Kong-based campus-recruitment and career-learning SaaS
  platform that helps employers connect with university talent across Southeast
  Asia through virtual job-tasting and work-experience programs. Founded in 2021
  by Jesse Chow and Chun Hin Anthony So, its B2B2C "OnMyGrad Space" lets
  employers build branded profiles, run virtual talent pipelines, and evaluate
  candidates, while students access immersive career and industry learning
  content from leading employers. The company launched its MVP in February 2021,
  raised pre-seed funding from 500 Global, and is expanding into Singapore and
  Taiwan. It operates a public marketing site and a web application but does not
  currently publish a public developer API, SDKs, or API documentation.
